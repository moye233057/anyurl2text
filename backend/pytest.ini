[pytest]
# 测试目录固定；`backend/` 下的项目内 import 由 tests/conftest.py 放进 sys.path。
testpaths = tests
# `tests/_workdir/` 是运行期落点（conftest 每条用例前后清空它），里面出现的任何东西都不是用例：
# 用例只写在 tests/ 下。不排除它会有实际后果——受限沙箱里 python 建得出目录却写不进、也删不掉，
# 那种幽灵目录会让 pytest 在**收集阶段**就报一堆 PermissionError（实测过）。
norecursedirs = _workdir

markers =
    model: 需要真实模型调用与本机 OCR / ASR 服务（会花钱、要有 8021/8022），由人在关键节点跑
    capability_detect: 能力域「类型识别与模态」——这个文件会不会被送对处理器、响应 type 对不对
    capability_document: 能力域「文档正文抽取」（pdf / docx / pptx / odt / odp / ofd / 纯文本 / epub / tsv 正文与页数）
    capability_understand: 能力域「模型增强路的编排」（进程内 + 假客户端：ADR-0011 正文对比、合并 OCR、记账、模型失败通道）
    capability_table: 能力域「表格」（合并单元格、列对齐、分隔符、数值格式、行列上限）
    capability_media: 能力域「图片与音视频」（结构信息、内嵌图去重与名额、音轨参数）
    capability_container: 能力域「容器」（压缩包与安装包的条目清单，不解压）
    capability_links: 能力域「链接抽取」（html / docx / epub 的链接与上限）
    capability_epub: 能力域「EPUB」（spine 顺序、章节标记、内部引用消歧、CSS 不进正文）
    capability_degrade: 能力域「降级与能力边界」（降级码、噪音文件、旧版 Office、坏容器）
    capability_limits: 能力域「上界命中与报告链路」（limits_hit / unprocessed_pages / 命中文案）
    capability_errors: 能力域「错误契约」（码表白名单、error 对象、模型失败通道、internal 兜底）
    capability_http: 能力域「真实服务契约」（打 HTTP：形状、状态码、上传；HTTP 缝只抽查代表）
    capability_utils: 能力域「编码与计价」（文本解码顺序、峰谷计价、账本累计）
    capability_structure: 能力域「结构门禁」（依赖方向、单文件预算、扩展名覆盖、上界值、契约镜像）
    capability_extensions: 能力域「扩展注册与提供商选择」（名单、归一化、单选规则、探活快照形状）

# 能力域标记怎么用（详见 AGENTS.md「测试用例怎么写」）：
#     python -m pytest tests -m capability_epub -v     # 只跑 EPUB 这一个能力域
#     python -m pytest tests -m "capability_table or capability_limits" -v
# 未登记的标记会被 --strict-markers 挡下——加能力域必须同时登记到这里。

# 默认只跑免费的自检缝（处理器 / 判型 / 通用件 / 结构）。
# 贵缝要显式点名，命令行上的 -m 会覆盖这里的值：
#     python -m pytest tests -m model -q
#
# 输出默认给人看：`-ra` 收尾列出没通过 / 跳过的原因，`--tb=short` 不淹没在完整调用栈里，
# `--durations=5` 指出最慢的 5 条（「跑了十几分钟」时能一眼看出是谁）。
# 每条用例的「这条在测什么」与完整清单由 tests/conftest.py 的 hook 写到
# backend/data/debug/last_test_run.txt。
# 想看每条实时名字加 `-v`（`-q` 与它相抵，两者别一起用）。
#
# `-p no:cacheprovider` 关掉 pytest 自己的缓存：缓存目录不存在时，pytest 会先在 backend/ 下
# mkdtemp 一个 `pytest-cache-files-*`，写完再原子改名成 `.pytest_cache`；改名之前那个临时目录
# 在受限环境（文件沙箱）里既写不进也删不掉，于是每跑一次就多留一个空目录。代价是没有
# `--lf` / `--ff`——本套件跑一次只要几秒，不值得为它留垃圾。
addopts = -m "not model" -p no:cacheprovider -ra --tb=short --durations=5 --strict-markers
